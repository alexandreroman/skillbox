# Temporal dev server for local development only — NOT for production.
# Runs the Temporal server, a built-in database, and the Web UI in a
# single process. Merge this `temporal` service into the project's
# compose.yaml and add `temporal` to the Makefile's {{infra-services}}.
#
# Workers and clients connect to `temporal:7233` from inside the Compose
# network, or `localhost:7233` from the host, using the `default`
# namespace.

services:
  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
    ports:
      - "7233:7233"  # gRPC endpoint for workers and clients
      - "8233:8233"  # Web UI — http://localhost:8233
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
